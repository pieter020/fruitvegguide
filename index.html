<title>Root to Tip</title>

<meta name="theme-color" content="#1a201b" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  /* Layout: list of products left, the chosen product's parts right (stacked on phones). Greengrocer ledger feel. */
  --bg: #f2f4ec;
  --surface: #ffffff;
  --ink: #1b241d;
  --muted: #5a665c;
  --line: #d8ddd0;
  --accent: #9b1d58;
  --accent-soft: #f6e4ec;
  --eat: #2c7a39;   --eat-bg: #e3f1e3;
  --cook: #9a6a12;  --cook-bg: #f6ecd6;
  --flavour: #2f639e; --flavour-bg: #e2ebf6;
  --limit: #b8501b; --limit-bg: #f8e5d9;
  --no: #8a2a2a;    --no-bg: #f3dfdf;
  --warn-bg: #fff6e6; --warn-line: #e7c98a;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111612; --surface: #1a201b; --ink: #e5eae2; --muted: #9ba69c; --line: #2d362f;
    --accent: #e46a9f; --accent-soft: #3a1f2c;
    --eat: #7fcf88; --eat-bg: #1f3323; --cook: #e2b25a; --cook-bg: #3a2f17;
    --flavour: #8cb6ea; --flavour-bg: #1d2a3b; --limit: #f09663; --limit-bg: #3d2519;
    --no: #ee8f8f; --no-bg: #3b1d1d; --warn-bg: #2e2716; --warn-line: #6d5a2c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111612; --surface: #1a201b; --ink: #e5eae2; --muted: #9ba69c; --line: #2d362f;
  --accent: #e46a9f; --accent-soft: #3a1f2c;
  --eat: #7fcf88; --eat-bg: #1f3323; --cook: #e2b25a; --cook-bg: #3a2f17;
  --flavour: #8cb6ea; --flavour-bg: #1d2a3b; --limit: #f09663; --limit-bg: #3d2519;
  --no: #ee8f8f; --no-bg: #3b1d1d; --warn-bg: #2e2716; --warn-line: #6d5a2c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }

.app { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left)); border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; flex-direction: column; margin-right: auto; }
.brand h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.01em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
.switch input { appearance: none; width: 40px; height: 22px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked { background: var(--eat); }
.switch input:checked::after { transform: translateX(18px); }

nav.tabs { display: flex; gap: 4px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 10px 12px; border-bottom: 3px solid transparent; font-weight: 700; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { min-height: 0; overflow: hidden; }
.view { height: 100%; overflow: auto; }
.view[hidden] { display: none; }

/* Products view */
.split { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; height: 100%; }
.listpane { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.filters { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.search { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 0.85rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chiplabel { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.count { font-size: 0.85rem; color: var(--muted); padding: 8px 16px 0; }
ul.plist { list-style: none; margin: 0; padding: 6px 8px calc(24px + env(safe-area-inset-bottom)); overflow: auto; flex: 1; }
ul.plist li button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: var(--r); padding: 9px 10px; cursor: pointer; display: grid; gap: 4px; }
ul.plist li button:hover { background: var(--accent-soft); }
ul.plist li button[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.pname { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pname strong { font-size: 1.02rem; }
.pname small { color: var(--muted); }
.flags { margin-left: auto; display: inline-flex; gap: 4px; }
.flag { font-size: 0.7rem; font-weight: 700; border-radius: 4px; padding: 0 5px; line-height: 1.6; }
.flag.fibre { background: var(--eat-bg); color: var(--eat); }
.flag.warn { background: var(--warn-bg); color: var(--limit); border: 1px solid var(--warn-line); }
.minis { display: flex; gap: 4px; flex-wrap: wrap; }
.mini { font-size: 0.75rem; border-radius: 4px; padding: 0 6px; line-height: 1.6; }

.s-eat { background: var(--eat-bg); color: var(--eat); }
.s-cook { background: var(--cook-bg); color: var(--cook); }
.s-flavour { background: var(--flavour-bg); color: var(--flavour); }
.s-limit { background: var(--limit-bg); color: var(--limit); }
.s-no { background: var(--no-bg); color: var(--no); }

.detail { overflow: auto; padding: 22px 28px 48px; }
.detail .inner { max-width: 760px; display: grid; gap: 18px; }
.backbtn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; justify-self: start; }
.dhead h2 { font-size: 2rem; font-weight: 700; }
.dhead p { margin: 4px 0 0; color: var(--muted); }
.fibrebox { border-left: 4px solid var(--eat); background: var(--eat-bg); padding: 10px 14px; border-radius: 0 var(--r) var(--r) 0; }
.fibrebox.neg { border-left-color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--muted); }
.fibrebox b { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.parts { display: grid; gap: 12px; }
.part { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.part-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.part-h h3 { font-size: 1.15rem; }
.pill { font-size: 0.8rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.part p { margin: 0; max-width: 65ch; }
.srcs { display: flex; gap: 6px; flex-wrap: wrap; }
.src { font-size: 0.75rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); text-decoration: none; }
.src i { font-style: normal; font-weight: 700; }
.src.measured i { color: var(--eat); }
.src.authority i { color: var(--flavour); }
.src.chef i { color: var(--accent); }
.warnbox { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; font-size: 0.95rem; }
.warnbox > b { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--limit); }
.warnbox p { margin: 0; }
.verify { display: inline-block; font-size: 0.72rem; font-weight: 700; color: var(--muted); border: 1px dashed var(--muted); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
details.folded { background: var(--eat-bg); border-radius: var(--r); padding: 8px 12px; font-size: 0.9rem; }
details.folded summary { cursor: pointer; color: var(--eat); font-weight: 700; }
details.folded p { margin: 6px 0 0; }
.techlinks { display: flex; gap: 6px; flex-wrap: wrap; }
.techlinks a { border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 3px 12px; text-decoration: none; font-size: 0.9rem; font-weight: 700; }
.sect-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.orgnote { font-size: 0.85rem; color: var(--muted); }

/* Techniques + About */
.page { padding: 22px 16px calc(60px + env(safe-area-inset-bottom)); }
.page .inner { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; }
.page h2 { font-size: 1.6rem; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; scroll-margin-top: 12px; }
.tcard:target { box-shadow: 0 0 0 2px var(--accent); }
.tcard h3 { font-size: 1.2rem; }
.tcard ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; max-width: 65ch; }
.used { font-size: 0.9rem; color: var(--muted); }
.used a { color: var(--ink); }
.prose p, .prose li { max-width: 68ch; }
.prose h3 { font-size: 1.15rem; margin-top: 8px; }
.legend { display: grid; gap: 8px; }
.legend div { display: flex; gap: 10px; align-items: baseline; }
.legend .pill { min-width: 9.5em; text-align: center; }
table.src-t { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
table.src-t td, table.src-t th { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
.tablewrap { overflow-x: auto; }

@media (max-width: 860px) {
  .split { grid-template-columns: 1fr; }
  .listpane { border-right: 0; }
  .split { display: block; }
  .listpane { height: 100%; }
  .detail { display: none; height: 100%; padding: 14px 16px 48px; }
  .split.showdetail .listpane { display: none; }
  .split.showdetail .detail { display: block; }
  .backbtn { display: inline-block; }
  .dhead h2 { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  const store = {
    get(k, d) { try { const v = localStorage.getItem("r2t-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("r2t-" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const navLang = (navigator.language || "en").toLowerCase().startsWith("nl") ? "nl" : "en";
  const state = {
    lang: store.get("lang", navLang),
    organic: store.get("organic", false),
    cat: "all", fam: null, q: "", sel: null, tab: "products"
  };
  const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
  const $ = id => document.getElementById(id);
  const T = () => UI[state.lang];
  const L = o => o[state.lang];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const name = p => p[state.lang];
  const other = p => p[state.lang === "nl" ? "en" : "nl"];
  const wide = () => window.matchMedia("(min-width: 861px)").matches;

  PRODUCTS.forEach(p => {
    p.hay = norm([p.id, p.nl, p.en, p.alias].join(" "));
    p.fams = new Set(p.parts.map(x => PART[x.t].f));
    p.anyWarn = p.w.length > 0 || p.parts.some(x => x.w.length);
  });
  // Technique → products that use it
  const techUse = {};
  PRODUCTS.forEach(p => p.tech.forEach(t => (techUse[t] = techUse[t] || []).push(p.id)));

  function srcChip(k) {
    const s = SOURCES[k];
    const cls = SRC_CLASS[s.cls];
    const label = `<i>${esc(L(cls))}</i> · ${esc(L(s))}`;
    const title = esc(state.lang === "nl" ? s.fullnl : s.full);
    return s.url
      ? `<a class="src ${s.cls}" href="${s.url}" target="_blank" rel="noopener" title="${title}">${label}</a>`
      : `<span class="src ${s.cls}" title="${title}">${label}</span>`;
  }

  function warnBlock(ids) {
    if (!ids.length) return "";
    const shown = [], folded = [];
    ids.forEach(id => (state.organic && WARN[id].organic ? folded : shown).push(id));
    let html = "";
    if (shown.length) {
      const official = shown.every(id => WARN[id].src.some(s => SOURCES[s].cls === "authority"));
      html += `<div class="warnbox"><b>${official ? T().official : T().caution}</b>` +
        shown.map(id => {
          const w = WARN[id];
          return `<p>${esc(L(w))}${w.verify ? ` <span class="verify">${T().verify}</span>` : ""}</p><div class="srcs">${w.src.map(srcChip).join("")}</div>`;
        }).join("") + `</div>`;
    }
    if (folded.length) {
      html += `<details class="folded"><summary>${T().organicFolded}</summary>` +
        folded.map(id => `<p>${esc(L(WARN[id]))}</p>`).join("") + `</details>`;
    }
    return html;
  }

  /* ---------- header, tabs ---------- */
  function renderChrome() {
    document.documentElement.lang = state.lang;
    const t = T();
    const words = t.title.split(" ");
    $("title").innerHTML = esc(words.slice(0, -1).join(" ")) + " <span>" + esc(words.slice(-1)[0]) + "</span>";
    $("tagline").textContent = t.tagline;
    $("organicLabel").textContent = t.organic;
    $("organic").checked = state.organic;
    ["nl", "en"].forEach(l => $("lang-" + l).setAttribute("aria-pressed", String(state.lang === l)));
    $("tabs").innerHTML = [["products", t.tabProducts], ["techniques", t.tabTech], ["about", t.tabAbout]]
      .map(([k, v]) => `<a href="#${k}" ${state.tab === k ? 'aria-current="page"' : ""}>${esc(v)}</a>`).join("");
    $("q").placeholder = t.search;
    $("q").setAttribute("aria-label", t.search);
    $("partsLabel").textContent = t.parts;
    $("cats").innerHTML = [["all", t.all]].concat(Object.entries(CATS).map(([k, v]) => [k, L(v)]))
      .map(([k, v]) => `<button type="button" class="chip" data-cat="${k}" aria-pressed="${state.cat === k}">${esc(v)}</button>`).join("");
    $("fams").innerHTML = Object.entries(FAMILY)
      .map(([k, v]) => `<button type="button" class="chip" data-fam="${k}" aria-pressed="${state.fam === k}">${esc(L(v))}</button>`).join("");
    ["products", "techniques", "about"].forEach(k => $("v-" + k).hidden = state.tab !== k);
  }

  /* ---------- product list ---------- */
  function filtered() {
    const q = norm(state.q.trim());
    return PRODUCTS.filter(p =>
      (state.cat === "all" || p.cat === state.cat) &&
      (!state.fam || p.fams.has(state.fam)) &&
      (!q || q.split(/\s+/).every(w => p.hay.includes(w)))
    ).sort((a, b) => name(a).localeCompare(name(b), state.lang));
  }

  function renderList() {
    const list = filtered();
    $("count").textContent = list.length ? T().results(list.length) : T().none;
    $("plist").innerHTML = list.map(p => {
      const minis = p.parts.map(x => `<span class="mini s-${x.s}" title="${esc(L(STATUS[x.s]))}">${esc(L(PART[x.t]))}</span>`).join("");
      const flags = (p.fibre ? `<span class="flag fibre" title="${T().fibre}">${state.lang === "nl" ? "vezels" : "fibre"}</span>` : "") +
        (p.anyWarn ? `<span class="flag warn" title="${T().caution}">!</span>` : "");
      return `<li><button type="button" data-id="${p.id}" ${state.sel === p.id ? 'aria-current="true"' : ""}>
        <span class="pname"><strong>${esc(name(p))}</strong>${other(p) !== name(p) ? `<small>${esc(other(p))}</small>` : ""}<span class="flags">${flags}</span></span>
        <span class="minis">${minis}</span></button></li>`;
    }).join("");
  }

  /* ---------- product detail ---------- */
  function renderDetail() {
    const d = $("detail");
    const p = byId[state.sel];
    document.querySelector(".split").classList.toggle("showdetail", !!p);
    if (!p) { d.innerHTML = ""; return; }
    const t = T();
    const fibre = p.fibre ? `<div class="fibrebox${p.neg ? " neg" : ""}"><b>${t.fibre}</b>${esc(L(p.fibre))}<div class="srcs" style="margin-top:6px">${srcChip("kcl")}</div></div>` : "";
    const pw = p.w.length ? `<div><div class="sect-label">${t.productWarn}</div>${warnBlock(p.w)}</div>` : "";
    const parts = p.parts.map(x => `<article class="part">
        <div class="part-h"><h3>${esc(L(PART[x.t]))}</h3><span class="pill s-${x.s}">${esc(L(STATUS[x.s]))}</span></div>
        <p>${esc(x[state.lang])}</p>
        <div class="srcs">${x.src.map(srcChip).join("")}</div>
        ${warnBlock(x.w)}
      </article>`).join("");
    const tech = p.tech.length ? `<div><div class="sect-label">${t.techniques}</div><div class="techlinks">${p.tech.map(k => `<a href="#t-${k}">${esc(TECH[k][state.lang].t)}</a>`).join("")}</div></div>` : "";
    d.innerHTML = `<div class="inner">
      <button type="button" class="backbtn" id="back">← ${t.back}</button>
      <div class="dhead"><h2>${esc(name(p))}</h2><p>${other(p) !== name(p) ? esc(other(p)) + " · " : ""}${esc(L(CATS[p.cat]))}</p></div>
      ${fibre}${pw}
      <div class="parts">${parts}</div>
      ${tech}
      <p class="orgnote">${state.organic ? t.organicOn : t.organicOff}</p>
    </div>`;
    d.scrollTop = 0;
  }

  /* ---------- techniques ---------- */
  function renderTech() {
    const t = T();
    const cards = Object.entries(TECH).map(([k, v]) => {
      const c = v[state.lang];
      const used = (techUse[k] || []).map(id => byId[id]).sort((a, b) => name(a).localeCompare(name(b), state.lang))
        .map(p => `<a href="#${p.id}">${esc(name(p))}</a>`).join(", ");
      return `<article class="tcard" id="t-${k}"><h3>${esc(c.t)}</h3>
        <ol>${c.s.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
        ${v.warn ? warnBlock(v.warn) : ""}
        <div class="srcs">${v.src.map(srcChip).join("")}</div>
        ${used ? `<div class="used">${t.usedFor}: ${used}</div>` : ""}</article>`;
    }).join("");
    $("v-techniques").innerHTML = `<div class="inner"><h2>${t.tabTech}</h2>${cards}</div>`;
  }

  /* ---------- about ---------- */
  function renderAbout() {
    const nl = state.lang === "nl";
    const legend = Object.entries(STATUS).map(([k, s]) => `<div><span class="pill s-${k}">${esc(L(s))}</span><span>${esc(nl ? s.dnl : s.den)}</span></div>`).join("");
    const ev = nl ? [
      ["measured", "Gemeten in het lab (alleen de 12 producten uit de King's College-studie, rauw)."],
      ["authority", "Een officiële instantie (EFSA, RIVM, Voedingscentrum, British Nutrition Foundation)."],
      ["chef", "Een met naam genoemde kok of schrijver uit het Guardian-artikel."],
      ["kitchen", "Gangbare keukenpraktijk, door Claude verzameld. Niet per regel onderbouwd."]
    ] : [
      ["measured", "Measured in a lab (only the 12 products in the King's College study, raw)."],
      ["authority", "An official body (EFSA, RIVM, Voedingscentrum, British Nutrition Foundation)."],
      ["chef", "A named chef or writer quoted in the Guardian article."],
      ["kitchen", "General kitchen practice compiled by Claude. Not sourced line by line."]
    ];
    const evHtml = ev.map(([k, d]) => `<div><span class="src ${k}"><i>${esc(L(SRC_CLASS[k]))}</i></span><span>${esc(d)}</span></div>`).join("");
    const verifyList = Object.entries(WARN).filter(([, w]) => w.verify)
      .map(([, w]) => `<li>${esc(L(w))}</li>`).join("");
    const srcRows = Object.values(SOURCES).map(s => `<tr><td>${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${esc(L(s))}</a>` : esc(L(s))}</td><td>${esc(L(SRC_CLASS[s.cls]))}</td><td>${esc(nl ? s.fullnl : s.full)}</td></tr>`).join("");
    $("v-about").innerHTML = `<div class="inner prose">
      <h2>${T().tabAbout}</h2>
      ${nl ? `<p>Per groente, fruit of kruid zie je welke delen meestal worden weggegooid, of je ze kunt eten, hoe, en wat officiële instanties erover zeggen. ${PRODUCTS.length} gangbare producten uit Nederlandse winkels en markten. Geïnspireerd door het A–Z-artikel in The Guardian van 17 november 2026.</p>
      <p>Wat koks doen en wat instanties adviseren, staat naast elkaar. Waar die botsen (kiwischil, aardappelschil) zie je beide en beslis je zelf.</p>`
      : `<p>For each fruit, vegetable or herb you'll see which parts usually get thrown away, whether you can eat them, how, and what official bodies say. ${PRODUCTS.length} common products from Dutch shops and markets. Inspired by The Guardian's A–Z of 17 November 2026.</p>
      <p>What chefs do and what the authorities advise sit side by side. Where they clash (kiwi skin, potato skin) you see both and decide.</p>`}
      <h3>${nl ? "Statussen" : "Statuses"}</h3><div class="legend">${legend}</div>
      <h3>${nl ? "Onderbouwing" : "Evidence"}</h3><div class="legend">${evHtml}</div>
      <h3>${nl ? "De schakelaar 'biologisch'" : "The organic switch"}</h3>
      <p>${nl ? "Aan: waarschuwingen over resten van bestrijdingsmiddelen en naoogstbehandeling van citrus worden ingeklapt. Waarschuwingen over natuurlijke gifstoffen (aardappel, rabarberblad, pitten) blijven altijd staan; die gelden ook voor biologisch." : "On: warnings about pesticide residues and post-harvest treatment of citrus fold away. Warnings about natural plant toxins (potato, rhubarb leaves, kernels) always stay; they apply to organic produce too."}</p>
      <h3>${nl ? "Grenzen van deze versie" : "Limits of this version"}</h3>
      <ul>
        <li>${nl ? "Vezelcijfers bestaan alleen voor de 12 producten uit de King's College-studie, gemeten in rauwe producten. Voor de rest zijn er geen cijfers en die worden ook niet verzonnen." : "Fibre figures exist only for the 12 products in the King's College study, measured raw. Everything else has no figures, and none are invented."}</li>
        <li>${nl ? "De meeste 'zo gebruik je het'-regels zijn gangbare keukenpraktijk die ik (Claude) heb samengesteld, niet per regel aan een bron gekoppeld." : "Most 'how to use it' lines are general kitchen practice compiled by me (Claude), not tied to a source line by line."}</li>
        <li>${nl ? "Dit is geen medisch advies. Ben je zwanger, kook je voor jonge kinderen of heb je bijvoorbeeld aanleg voor nierstenen, kijk dan bij het Voedingscentrum of je arts." : "This is not medical advice. If you're pregnant, cooking for small children, or prone to kidney stones, for example, check the Voedingscentrum or your doctor."}</li>
      </ul>
      <h3>${nl ? "Nog te controleren" : "Still to verify"}</h3>
      <p>${nl ? "Deze waarschuwingen heb ik niet tegen de oorspronkelijke bron kunnen controleren. Ze staan in de tool met het label" : "I couldn't check these warnings against the primary source. They carry the label"} <span class="verify">${T().verify}</span>.</p>
      <ul>${verifyList}</ul>
      <h3>${nl ? "Bronnen" : "Sources"}</h3>
      <div class="tablewrap"><table class="src-t"><thead><tr><th>${nl ? "Bron" : "Source"}</th><th>${nl ? "Soort" : "Type"}</th><th>${nl ? "Toelichting" : "Notes"}</th></tr></thead><tbody>${srcRows}</tbody></table></div>
      <p class="orgnote">${nl ? "Versie 1, 17 november 2026." : "Version 1, 17 November 2026."}</p>
    </div>`;
  }

  function renderAll() { renderChrome(); renderList(); renderDetail(); renderTech(); renderAbout(); }

  /* ---------- routing ---------- */
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "techniques" || h.startsWith("t-")) state.tab = "techniques";
    else if (h === "about") state.tab = "about";
    else {
      state.tab = "products";
      if (byId[h]) state.sel = h;
      else if (h === "products" || h === "") state.sel = wide() ? (state.sel || filtered()[0].id) : null;
    }
    renderChrome(); renderList(); renderDetail();
    if (h.startsWith("t-")) { const el = $(h); if (el) el.scrollIntoView(); }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.lang) { state.lang = b.dataset.lang; store.set("lang", state.lang); renderAll(); }
    else if (b.dataset.cat) { state.cat = b.dataset.cat; renderChrome(); renderList(); }
    else if (b.dataset.fam) { state.fam = state.fam === b.dataset.fam ? null : b.dataset.fam; renderChrome(); renderList(); }
    else if (b.dataset.id) { if (location.hash.slice(1) === b.dataset.id) route(); else location.hash = b.dataset.id; }
    else if (b.id === "back") { state.sel = null; location.hash = "products"; }
  });
  $("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
  $("organic").addEventListener("change", e => { state.organic = e.target.checked; store.set("organic", state.organic); renderDetail(); renderTech(); });
  window.addEventListener("hashchange", route);

  renderAll();
  route();
})();

// Offline support: register the service worker (installable app).
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

</script>
</body>
</html>
